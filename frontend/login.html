<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login — Eclipse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./css/login.css"></head><body><div class="glow one"></div><div class="glow two"></div><main class="page"><section class="card"><div class="brand"><span class="logo">◐</span><span>ECLIPSE</span></div><div class="intro"><p>WELCOME BACK</p><h1>Enter the Eclipse.</h1><span>Sign in to continue your social orbit.</span></div><form id="loginForm" novalidate><label>Email address<div class="input"><span>✉</span><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><small id="emailError"></small></label><label><div class="pass-label"><span>Password</span><button type="button" id="forgot">Forgot password?</button></div><div class="input"><span>●</span><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password"><button type="button" id="toggle">Show</button></div><small id="passwordError"></small></label><label class="remember"><input id="remember" type="checkbox"><span>Remember me</span></label><button class="login" id="loginButton" type="submit"><span id="loginText">Log in</span><span id="spinner" class="spinner hidden"></span></button><div id="message"></div></form><div class="divider"><span>or</span></div><div class="signup">Don't have an account? <a href="./register.html">Create an account</a></div></section><footer>© Eclipse · Connect. Share. Discover.</footer></main><script src="./js/login.js"></script></body></html>
